name: selftest

# Proves every reusable workflow in this repository against the fixtures beside it, BEFORE any
# consumer repository is touched. This is the acceptance gate for the archetype itself: if the
# selftest is red, no consumer may be flipped to it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The static gate for the trust root. Every consumer runs this repository's `main` with
  # `packages: write`, so a defect here is a defect in ten repositories at once: actionlint
  # catches malformed workflow/expression syntax, zizmor catches the security-relevant patterns
  # (template injection into `run:`, unpinned actions, over-broad permissions, persisted
  # credentials). Both are pinned — the lint of a trust root must not itself float.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint (pinned release tarball, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --max-time 60 "$url" -o "$tmp/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          "$tmp/actionlint" -color

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: zizmor (pinned, auditor persona, gates medium and above)
        run: uvx zizmor==1.32.0 --persona=auditor --min-severity=medium --format=plain .

  # The scan jobs in every archetype read this repository's `main` — a caller-supplied ref cannot
  # be allowed to choose the code those jobs execute. That removes the selftest's old way of
  # exercising a PR's scripts, so this job runs the PR's OWN scripts against the PR tree. Same
  # coverage, no untrusted checkout.
  guard-scripts:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: secret-scan (this tree)
        run: bash scripts/secret-scan.sh
      - name: no-private-refs (this tree)
        run: bash scripts/no-private-refs.sh

  service:
    uses: ./.github/workflows/python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-selftest
      working_directory: fixtures/python-app
      src_dir: src
      has_postgres: true
      has_redis: true
      alembic: false
      # Proves db_bootstrap_cmd's exports reach the integration pytest process: the fixture
      # test asserts SELFTEST_BOOTSTRAP, which only this prefix can set.
      db_bootstrap_cmd: export SELFTEST_BOOTSTRAP=1
      integration_test_select: tests/test_bootstrap_env.py -m integration
      build_smoke: |
        set -euo pipefail
        docker run -d --name selftest-app -p 18080:8080 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:18080/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs selftest-app || true
        docker rm -f selftest-app || true
        [ "$ok" -eq 1 ]

  library:
    uses: ./.github/workflows/python-library.yml
    with:
      working_directory: fixtures/python-lib
      src_dir: src

  # Proves node-service.yml end to end: the fixture has no dependencies, so `npm ci` contacts no
  # registry and a red run points at the archetype rather than at npm.
  node:
    uses: ./.github/workflows/node-service.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-node-selftest
      working_directory: fixtures/node-app
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run -d --name selftest-node -p 18081:8080 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:18081/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs selftest-node || true
        docker rm -f selftest-node || true
        [ "$ok" -eq 1 ]

  # Proves go-service.yml end to end: go mod verify + go vet + go test, then the image build and
  # a /health smoke against it.
  go:
    uses: ./.github/workflows/go-service.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-go-selftest
      working_directory: fixtures/go-app/src
      dockerfile: fixtures/go-app/src/Dockerfile
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run -d --name selftest-go -p 18082:8080 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:18082/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs selftest-go || true
        docker rm -f selftest-go || true
        [ "$ok" -eq 1 ]

  imageonly:
    uses: ./.github/workflows/image-only.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-image-selftest
      working_directory: fixtures/image-only
      # The fixture turns the build arg into ENV and the smoke reads it back from $IMAGE:ci —
      # that covers the LOCAL build only. `imageonly-published` below proves the pushed image.
      build_args: GREETING=hi
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run --rm "$IMAGE_REF" sh -c 'test "$GREETING" = hi'
        echo "build arg reached the image"

  imageonly-published:
    # Acceptance gate for the ARG-PLUMBING DEFECT fixed 2026-11-13: the publish steps used to
    # invoke buildx without --build-arg, so the pushed image was rebuilt from the Dockerfile
    # DEFAULT. The `imageonly` smoke could not see it (it only ever ran against $IMAGE:ci).
    #
    # This job pulls the tag the reusable workflow ACTUALLY PUBLISHED — `pr-<7>` on a same-repo
    # PR, `sha-<7>` on main — and reads the arg back. RED if the publish drops the args
    # (GREETING would be `hello`, the fixture default), GREEN with the fix. Fork PRs push
    # nothing, so image_ref is empty and the job is skipped.
    needs: imageonly
    if: needs.imageonly.outputs.image_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Read the build arg back from the PUBLISHED image
        env:
          IMAGE_REF: ${{ needs.imageonly.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REF" sh -c 'test "$GREETING" = hi'
          echo "published $IMAGE_REF still carries GREETING=hi"

