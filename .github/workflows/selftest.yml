name: selftest

# Proves every reusable workflow in this repository against the fixtures beside it, BEFORE any
# consumer repository is touched. This is the acceptance gate for the archetype itself: if the
# selftest is red, no consumer may be flipped to it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-selftest
      working_directory: fixtures/python-app
      src_dir: src
      has_postgres: true
      has_redis: true
      alembic: false
      # Proves db_bootstrap_cmd's exports reach the integration pytest process: the fixture
      # test asserts SELFTEST_BOOTSTRAP, which only this prefix can set.
      db_bootstrap_cmd: export SELFTEST_BOOTSTRAP=1
      integration_test_select: tests/test_bootstrap_env.py -m integration
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run -d --name selftest-app -p 18080:8080 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:18080/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs selftest-app || true
        docker rm -f selftest-app || true
        [ "$ok" -eq 1 ]

  library:
    uses: ./.github/workflows/python-library.yml
    with:
      working_directory: fixtures/python-lib
      src_dir: src
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  imageonly:
    uses: ./.github/workflows/image-only.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-image-selftest
      working_directory: fixtures/image-only
      # The fixture turns the build arg into ENV and the smoke reads it back from $IMAGE:ci —
      # that covers the LOCAL build only. `imageonly-published` below proves the pushed image.
      build_args: GREETING=hi
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run --rm "$IMAGE_REF" sh -c 'test "$GREETING" = hi'
        echo "build arg reached the image"

  imageonly-published:
    # Acceptance gate for the ARG-PLUMBING DEFECT fixed 2026-11-13: the publish steps used to
    # invoke buildx without --build-arg, so the pushed image was rebuilt from the Dockerfile
    # DEFAULT. The `imageonly` smoke could not see it (it only ever ran against $IMAGE:ci).
    #
    # This job pulls the tag the reusable workflow ACTUALLY PUBLISHED — `pr-<7>` on a same-repo
    # PR, `sha-<7>` on main — and reads the arg back. RED if the publish drops the args
    # (GREETING would be `hello`, the fixture default), GREEN with the fix. Fork PRs push
    # nothing, so image_ref is empty and the job is skipped.
    needs: imageonly
    if: needs.imageonly.outputs.image_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Read the build arg back from the PUBLISHED image
        env:
          IMAGE_REF: ${{ needs.imageonly.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REF" sh -c 'test "$GREETING" = hi'
          echo "published $IMAGE_REF still carries GREETING=hi"

