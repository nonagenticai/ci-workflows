name: selftest

# Proves every reusable workflow in this repository against the fixtures beside it, BEFORE any
# consumer repository is touched. This is the acceptance gate for the archetype itself: if the
# selftest is red, no consumer may be flipped to it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The static gate for the trust root. Every consumer runs this repository's `main` with
  # `packages: write`, so a defect here is a defect in ten repositories at once: actionlint
  # catches malformed workflow/expression syntax, zizmor catches the security-relevant patterns
  # (template injection into `run:`, unpinned actions, over-broad permissions, persisted
  # credentials). Both are pinned — the lint of a trust root must not itself float.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint (pinned release tarball, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --max-time 60 "$url" -o "$tmp/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          "$tmp/actionlint" -color

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: zizmor (pinned, auditor persona, gates medium and above)
        run: uvx zizmor==1.32.0 --persona=auditor --min-severity=medium --format=plain .

  # The scan jobs in every archetype read this repository's `main` — a caller-supplied ref cannot
  # be allowed to choose the code those jobs execute. That removes the selftest's old way of
  # exercising a PR's scripts, so this job runs the PR's OWN scripts against the PR tree. Same
  # coverage, no untrusted checkout.
  guard-scripts:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: secret-scan (this tree)
        run: bash scripts/secret-scan.sh
      - name: no-private-refs (this tree)
        run: bash scripts/no-private-refs.sh

      # A guard that has only ever been seen to pass is indistinguishable from one that cannot
      # fail. This is the positive control: the exact shape that was published in a real public
      # repository on 2026-11-15 and passed the guard — a documented login into a private address
      # with the password piped into sudo's stdin flag. It must be refused, or the guard has
      # regressed.
      # The two negative controls beside it are ordinary code (`jackc/pgx`, a short identifier)
      # that must NOT be refused; a guard that cries wolf is one people learn to ignore.
      #
      # The bad fixture is assembled from variables rather than written literally, because this
      # file is itself tracked: written literally it would (correctly) fail the guard that runs
      # two steps above. That is not evasion — the assembled string is byte-identical to the
      # published one, and the assertion below proves the guard sees it.
      - name: no-private-refs positive control (must FAIL on known-bad input)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp scripts/no-private-refs.sh "$tmp/guard.sh"
          cd "$tmp"
          git init -q .
          git config user.email selftest@invalid
          git config user.name selftest

          h='mf1'; ip='192.168.1.119'; k='S'; zone='internal'
          {
            printf -- '--     ssh %s@%s \\\n' "$h" "$ip"
            printf -- '--       "echo %s | sudo -%s -u postgres psql -d postgres -f -" \\\n' "$h" "$k"
          } > leaked.sql
          {
            printf 'host: postgres.%s\n' "$zone"
            printf 'db: %s.local\n' "$h"
          } > leaked.md
          printf 'import _ "github.com/jackc/pgx/v5"\nvar hp1 = 3\n' > fine.go

          git add -A
          if bash guard.sh > out.txt 2>&1; then
            echo "::error::the guard PASSED a tree containing a published login and internal hosts"
            cat out.txt
            exit 1
          fi
          for want in 'PRIVATE: leaked.sql' 'PRIVATE: leaked.md'; do
            grep -qF "$want" out.txt || { echo "::error::expected '$want'"; cat out.txt; exit 1; }
          done
          if grep -qF 'fine.go' out.txt; then
            echo "::error::false positive: ordinary code was refused"
            grep -F 'fine.go' out.txt
            exit 1
          fi
          echo "OK: refused the leak, ignored ordinary code"

  service:
    uses: ./.github/workflows/python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-selftest
      working_directory: fixtures/python-app
      src_dir: src
      has_postgres: true
      has_redis: true
      alembic: false
      # Proves db_bootstrap_cmd's exports reach the integration pytest process: the fixture
      # test asserts SELFTEST_BOOTSTRAP, which only this prefix can set.
      db_bootstrap_cmd: export SELFTEST_BOOTSTRAP=1
      integration_test_select: tests/test_bootstrap_env.py -m integration
      build_smoke: |
        set -euo pipefail
        docker run -d --name selftest-app -p 18080:8080 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:18080/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs selftest-app || true
        docker rm -f selftest-app || true
        [ "$ok" -eq 1 ]

  library:
    uses: ./.github/workflows/python-library.yml
    with:
      working_directory: fixtures/python-lib
      src_dir: src

  # Proves node-service.yml end to end: the fixture has no dependencies, so `npm ci` contacts no
  # registry and a red run points at the archetype rather than at npm.
  node:
    uses: ./.github/workflows/node-service.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-node-selftest
      working_directory: fixtures/node-app
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run -d --name selftest-node -p 18081:8080 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:18081/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs selftest-node || true
        docker rm -f selftest-node || true
        [ "$ok" -eq 1 ]

  # Proves go-service.yml end to end: go mod verify + go vet + go test, then the image build and
  # a /health smoke against it.
  go:
    uses: ./.github/workflows/go-service.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-go-selftest
      working_directory: fixtures/go-app/src
      dockerfile: fixtures/go-app/src/Dockerfile
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run -d --name selftest-go -p 18082:8080 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:18082/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs selftest-go || true
        docker rm -f selftest-go || true
        [ "$ok" -eq 1 ]

  # Proves rust-preflight.yml end to end: `rustup show` resolves a toolchain without a pin,
  # `cargo fmt --all -- --check` has a tree to judge, and `cargo clippy --all-targets -D warnings`
  # compiles the fixture's lib, its unit-test module AND its `tests/` integration target. The
  # package name is passed so the `-p` arm of the script is the arm under test — a `run:` string
  # built by hand would be the zizmor template-injection finding this repository lints at medium.
  #
  # No `needs_postgres`: the fixture embeds no build-time query macros, and the flag's own value
  # is proven by the fixture NOT connecting to anything.
  rust-preflight:
    uses: ./.github/workflows/rust-preflight.yml
    with:
      working_directory: fixtures/rust-app
      package: rust-app-a
      timeout_minutes: 15

  imageonly:
    uses: ./.github/workflows/image-only.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ci-workflows-image-selftest
      working_directory: fixtures/image-only
      # The fixture turns the build arg into ENV and the smoke reads it back from $IMAGE:ci —
      # that covers the LOCAL build only. `imageonly-published` below proves the pushed image.
      build_args: GREETING=hi
      ci_workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_smoke: |
        set -euo pipefail
        docker run --rm "$IMAGE_REF" sh -c 'test "$GREETING" = hi'
        echo "build arg reached the image"

  imageonly-published:
    # Acceptance gate for the ARG-PLUMBING DEFECT fixed 2026-11-13: the publish steps used to
    # invoke buildx without --build-arg, so the pushed image was rebuilt from the Dockerfile
    # DEFAULT. The `imageonly` smoke could not see it (it only ever ran against $IMAGE:ci).
    #
    # This job pulls the tag the reusable workflow ACTUALLY PUBLISHED — `pr-<7>` on a same-repo
    # PR, `sha-<7>` on main — and reads the arg back. RED if the publish drops the args
    # (GREETING would be `hello`, the fixture default), GREEN with the fix. Fork PRs push
    # nothing, so image_ref is empty and the job is skipped.
    needs: imageonly
    if: needs.imageonly.outputs.image_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Read the build arg back from the PUBLISHED image
        env:
          IMAGE_REF: ${{ needs.imageonly.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REF" sh -c 'test "$GREETING" = hi'
          echo "published $IMAGE_REF still carries GREETING=hi"


  # Proves rust-service.yml end to end. The fixture is the dependency-free workspace already
  # beside rust-preflight's job: fmt and clippy have a tree to judge, and nextest is partitioned
  # over TWO shards so the matrix and the `checks` aggregator are the arms under test, not just
  # the single-shard default. `mode: package` proves the `-p` arm resolves from an input rather
  # than a hand-built `run:` string. Postgres and Redis are started and deliberately never
  # connected to — that proves the startup blocks (and their storage flags) without adding a
  # client the archetype does not own. The image job builds fixtures/rust-app/Dockerfile, reads
  # GREETING back from the built image (build-arg plumbing) and publishes on main.
  rust-service:
    uses: ./.github/workflows/rust-service.yml
    permissions:
      contents: read
      packages: write
    with:
      working_directory: fixtures/rust-app
      package: rust-app-a
      mode: package
      shards: 2
      pre_test_command: echo "selftest pre_test_command ran"
      needs_postgres: true
      needs_redis: true
      cache_shared_key: checks
      image_dockerfile: fixtures/rust-app/Dockerfile
      image_build_args: |
        GREETING=selftest
      image_name: ci-workflows-rust-selftest
      image_smoke: |
        set -euo pipefail
        docker run --rm "$IMAGE_REF" sh -c 'test "$GREETING" = selftest'
        echo "build arg reached the image"
      publish_image: true
      timeout_minutes: 20
