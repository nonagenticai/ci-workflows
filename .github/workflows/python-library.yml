# The public python-library pipeline: gates and a wheel build, no publish.
#
# Counterpart of `gitops-production/.github/workflows/python-library.yml`. The private archetype
# publishes the wheel to the estate's internal package index — a public repo cannot reach it and
# must not depend on it. Public consumers of a library in this org take it as a git dependency:
#
#     [tool.uv.sources]
#     demo-lib = { git = "https://github.com/nonagenticai/<repo>", rev = "<sha>" }
#
# so `uv build` here exists to prove the project still packages, not to ship it anywhere.
#
# ⛔ Do NOT add a PyPI publish job to this reusable workflow. PyPI refuses a reusable workflow as a
# Trusted Publisher — "Reusable workflows cannot currently be used as the workflow in a Trusted
# Publisher" (pypi/warehouse#11096) — so an upload job here cannot use OIDC and would need a
# long-lived token secret. A repo that publishes to PyPI carries its own
# `.github/workflows/publish.yml` with `id-token: write` and environment `pypi`, and keeps its
# gates here. Reference: nonagenticai/coding-client `.github/workflows/publish.yml`.
#
# Same rules as python-service.yml: ubuntu-latest only, zero repo secrets, every job gated on
# `!github.event.repository.private`.
---
name: python-library-public

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        default: "3.14"
      uv_version:
        type: string
        default: "0.13.7"
      src_dir:
        type: string
        default: "src"
      test_dir:
        type: string
        default: "tests/"
      working_directory:
        type: string
        default: "."
      uv_sync_args:
        type: string
        default: "--all-extras"
      extra_apt:
        type: string
        default: ""
      pip_audit_ignores:
        type: string
        default: ""
      enable_security_scans:
        type: boolean
        default: true
      ci_workflows_ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secret-scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ inputs.ci_workflows_ref || 'main' }}
          path: .ci-workflows
          persist-credentials: false
      - run: bash .ci-workflows/scripts/secret-scan.sh

  no-private-refs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ inputs.ci_workflows_ref || 'main' }}
          path: .ci-workflows
          persist-credentials: false
      - run: bash .ci-workflows/scripts/no-private-refs.sh

  checks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install extra apt packages
        if: inputs.extra_apt != ''
        working-directory: .
        env:
          EXTRA_APT: ${{ inputs.extra_apt }}
        run: |
          set -euo pipefail
          read -r -a apt <<< "$EXTRA_APT"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true "${apt[@]}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ inputs.uv_version }}
          python-version: ${{ inputs.python_version }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Lockfile freshness (uv.lock vs pyproject.toml)
        run: uv lock --check

      - name: Install dependencies
        id: install-deps
        env:
          UV_SYNC_ARGS: ${{ inputs.uv_sync_args }}
        run: |
          set -euo pipefail
          # The input is a whitespace-separated flag list; read -a splits it WITHOUT globbing,
          # which an unquoted expansion would also do.
          read -r -a sync_args <<< "$UV_SYNC_ARGS"
          uv sync "${sync_args[@]}"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check --config "extend-exclude=['*.md']" .

      - name: Type check (ty)
        # PINNED deliberately: ty is a CI TOOL, not a library, so its version belongs to the
        # archetype rather than to each consumer's dependency graph. Unpinned (`uv run ty`) made
        # Dependabot raise the same bump in 8 repos at once, and ty 0.0.100 turned 14 PRs red on
        # diagnostics (`incompatible-mutable-override`, `missing-union-attribute`) that are real
        # but not worth chasing in Python we are exiting. Move this pin, never the consumers.
        env:
          SRC_DIR: ${{ inputs.src_dir }}
        run: uvx ty@0.0.39 check "$SRC_DIR"

      - name: Run tests
        env:
          TEST_DIR: ${{ inputs.test_dir }}
        run: uv run pytest "$TEST_DIR" -v --tb=short

      - name: Build wheel and sdist
        run: uv build

      - name: Install security tools
        if: (success() || failure()) && inputs.enable_security_scans && steps.install-deps.outcome == 'success'
        run: uv pip install "bandit[toml]" pip-audit

      - name: Security scan - bandit
        if: inputs.enable_security_scans
        env:
          SRC_DIR: ${{ inputs.src_dir }}
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -qE '^\[tool\.bandit(\]|\.)' pyproject.toml; then
            uv run bandit -c pyproject.toml -r "$SRC_DIR" -ll -ii -x ./.venv,./tests,./build,./dist,./.git,./node_modules
          else
            uv run bandit -r "$SRC_DIR" -ll -ii -x ./.venv,./tests,./build,./dist,./.git,./node_modules
          fi

      - name: Security scan - pip-audit
        if: (success() || failure()) && inputs.enable_security_scans && steps.install-deps.outcome == 'success'
        env:
          PIP_AUDIT_IGNORES: ${{ inputs.pip_audit_ignores }}
        run: |
          set -euo pipefail
          read -r -a ignores <<< "$PIP_AUDIT_IGNORES"
          rc=0
          for attempt in 1 2 3; do
            uv run pip-audit --skip-editable "${ignores[@]}" && exit 0
            rc=$?
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::pip-audit attempt $attempt failed (rc=$rc); retrying after backoff"
              sleep $((attempt * 15))
            fi
          done
          exit "$rc"
