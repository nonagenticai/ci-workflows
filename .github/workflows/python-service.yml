# The public python-service pipeline.
#
# WHY THIS FILE EXISTS. A public repository may only call PUBLIC reusable workflows, so the
# private archetype (`gitops-production/.github/workflows/python-service.yml`) cannot be used by
# any repository once it is public. This is its public counterpart: the same gates, none of the
# estate's private plumbing.
#
# WHAT IS DELIBERATELY ABSENT, and why (the private archetype has all of it):
#   * registry login / the estate's internal registry mirror — a public repo builds from Docker Hub
#   * sccache, registry build cache                — estate-side infrastructure
#   * rmt-drift-guard, lock-downgrade-guard        — private composite actions; lock freshness
#     is still gated here by `uv lock --check`
#   * Flux receiver, `:latest` promote, kubectl rollout wait — DEPLOY IS NOT IN THIS REPO.
#     Images are pushed to ghcr; Flux in gitops-production watches the ImagePolicy.
#   * validate-no-upstream-refs — that private gate FORBIDS docker.io refs, the exact opposite
#     of what a public repo needs. `no-private-refs` replaces it: it refuses internal-only host
#     names and tailnet addresses, which is the rule that matters when publishing.
#
# ZERO REPO SECRETS. Nothing here references `secrets.*`; the only token is the automatic
# `github.token`, used solely to push an image from main. A fork PR gets a read-only token and no
# secrets by construction — there is no `pull_request_target` and no `workflow_run`.
#
# EVERY JOB IS GATED on `!github.event.repository.private` so a consumer can add its calling job
# while the repo is still private (the called jobs report "skipped", never red) and activate with
# no edit at the moment of the public flip. The caller gates too; this is the belt-and-braces.
---
name: python-service-public

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name to build; published as ghcr.io/<registry_owner>/<image_name>."
        type: string
        required: true
      registry_owner:
        description: "ghcr owner (org) the image is published under."
        type: string
        default: nonagenticai
      python_version:
        description: "Python version for setup-uv."
        type: string
        default: "3.14"
      uv_version:
        description: |
          uv version. Default matches the `ghcr.io/astral-sh/uv` image pinned in every
          consumer's Dockerfile, so CI and the image build resolve the same lock the same way.
        type: string
        default: "0.13.7"
      src_dir:
        description: "Source directory for bandit + ty (relative to working_directory)."
        type: string
        default: "src"
      test_dir:
        description: "Pytest target."
        type: string
        default: "tests/"
      working_directory:
        description: "Directory the project lives in, relative to the repo root."
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to working_directory."
        type: string
        default: "Dockerfile"
      uv_sync_args:
        description: "Arguments to `uv sync`."
        type: string
        default: "--all-extras"
      has_postgres:
        description: "Start an ephemeral pgvector/pgvector:pg18 and export DATABASE_URL + PG_*."
        type: boolean
        default: false
      database_name:
        description: "Database name. Empty = '<image_name>_ci'."
        type: string
        default: ""
      alembic:
        description: "Assert a single alembic head, then `alembic upgrade head`, against the sidecar."
        type: boolean
        default: false
      db_bootstrap_cmd:
        description: |
          Shell command run (from working_directory) in the SAME shell as the DB-integration
          pytest, immediately before it — so anything it exports is visible to the tests.
          Only runs when integration_test_select is set. Empty = skip.
        type: string
        default: ""
      integration_test_select:
        description: "Pytest target for database integration tests. Empty = skip."
        type: string
        default: ""
      has_redis:
        description: "Start an ephemeral redis sidecar."
        type: boolean
        default: false
      extra_apt:
        description: "Space-separated apt packages installed before uv sync."
        type: string
        default: ""
      oracle_modules:
        description: "Space-separated importable modules to execute after the test suite."
        type: string
        default: ""
      pip_audit_ignores:
        description: "Space-separated --ignore-vuln flags. Empty = no ignores."
        type: string
        default: ""
      enable_security_scans:
        description: "Run bandit + pip-audit."
        type: boolean
        default: true
      build_smoke:
        description: |
          Shell snippet proving the built image works. Receives $IMAGE_REF. Empty = skip.
          Same contract as the private archetype's `build_smoke`, so consumers keep their
          existing snippet unchanged.
        type: string
        default: ""
      build_timeout_minutes:
        description: "Timeout for the image job."
        type: number
        default: 60
      test_timeout_seconds:
        description: "Per-test timeout injected when the project does not provide pytest-timeout."
        type: number
        default: 300
      integration_test_timeout_seconds:
        description: "Per-test timeout for integration tests."
        type: number
        default: 600
      ci_workflows_ref:
        description: |
          Commit/branch of THIS repository whose scripts/ and fleet betterleaks config are used.
          Consumers leave it empty (= `main`, the ref they pin in `uses:`); the selftest passes
          its own sha.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # A secret is a fact about the tree, not about whether the build works, so this runs in
  # parallel and gates nothing. Dir mode over the whole tree: for a public repo a pre-existing
  # credential is a leak whether or not the current PR touched it.
  secret-scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ inputs.ci_workflows_ref || 'main' }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan the tree
        run: bash .ci-workflows/scripts/secret-scan.sh

  # Private infrastructure must not be published. The secret scan catches credentials; this
  # catches the other half of the rule: internal hostnames, tailnet addresses, private repo
  # paths, in every tracked file including docs and fixtures.
  no-private-refs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ inputs.ci_workflows_ref || 'main' }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan tracked files
        run: bash .ci-workflows/scripts/no-private-refs.sh

  checks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install extra apt packages
        if: inputs.extra_apt != ''
        working-directory: .
        env:
          EXTRA_APT: ${{ inputs.extra_apt }}
        run: |
          set -euo pipefail
          read -r -a apt <<< "$EXTRA_APT"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true "${apt[@]}"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv_version }}
          python-version: ${{ inputs.python_version }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      # The private archetype enforces this in a composite action (lock-downgrade-guard);
      # the freshness half is available natively and is the half that matters here — a lock
      # that no longer matches pyproject.toml must never reach the image build.
      - name: Lockfile freshness (uv.lock vs pyproject.toml)
        run: uv lock --check

      - name: Install dependencies
        id: install-deps
        env:
          UV_SYNC_ARGS: ${{ inputs.uv_sync_args }}
        run: |
          set -euo pipefail
          # The input is a whitespace-separated flag list; read -a splits it WITHOUT globbing.
          read -r -a sync_args <<< "$UV_SYNC_ARGS"
          uv sync "${sync_args[@]}"

      - name: Start ephemeral postgres
        if: inputs.has_postgres
        working-directory: .
        env:
          INPUT_DB: ${{ inputs.database_name }}
          INPUT_IMAGE: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          DB="$INPUT_DB"
          [ -n "$DB" ] || DB="${INPUT_IMAGE}_ci"
          # Disk-backed named volume, NOT a --tmpfs: conveyor measured the RAM-capped tmpfs
          # running out after ~1000 test databases (md.c, "No space left on device").
          # --shm-size=1g: the 64 MB default breaks Postgres parallel workers (dsm_impl.c).
          # ⚠️ Mount at /var/lib/postgresql, NOT /var/lib/postgresql/data: the postgres:18
          # image moved PGDATA into a version subdirectory and REFUSES to start on the old
          # mount point (measured 2026-11-13 — the container exits 1 and --rm erases it).
          docker volume create cipg >/dev/null
          if ! out="$(docker run -d --name cipg \
            -p 127.0.0.1:5432:5432 \
            --shm-size=1g \
            -e POSTGRES_USER=ci_test -e POSTGRES_PASSWORD=ci_test -e POSTGRES_DB="$DB" \
            -v cipg:/var/lib/postgresql \
            pgvector/pgvector:pg18 \
            -c fsync=off -c max_connections=300 \
            -c checkpoint_timeout=30s -c max_wal_size=256MB 2>&1)"; then
            echo "::error::docker run failed for the CI database"; echo "$out"; exit 1
          fi
          for i in $(seq 1 90); do
            if docker exec cipg pg_isready -U ci_test -d "$DB" >/dev/null 2>&1; then
              echo "postgres ready (attempt $i)"; break
            fi
            [ "$i" -eq 90 ] && { echo "::error::ephemeral postgres did not become ready in 90s"; docker logs cipg || true; exit 1; }
            sleep 1
          done
          {
            echo "POSTGRES_CI_HOST=127.0.0.1"
            echo "POSTGRES_CI_PORT=5432"
            echo "POSTGRES_CI_USER=ci_test"
            echo "POSTGRES_CI_PASSWORD=ci_test"
            echo "DATABASE_URL=postgresql+psycopg://ci_test:ci_test@127.0.0.1:5432/$DB"
            echo "PG_HOST=127.0.0.1"
            echo "PG_PORT=5432"
            echo "PG_USER=ci_test"
            echo "PG_PASSWORD=ci_test"
            echo "PGOPTIONS=-c statement_timeout=300s"
            echo "PG_SCHEMA=public"
            echo "PG_DATABASE=$DB"
          } >> "$GITHUB_ENV"

      - name: Start ephemeral redis
        if: inputs.has_redis
        working-directory: .
        run: |
          set -euo pipefail
          docker run --rm -d --name ciredis -p 127.0.0.1:6379:6379 redis:7-alpine >/dev/null
          for i in $(seq 1 60); do
            if [ "$(docker exec ciredis redis-cli ping 2>/dev/null)" = "PONG" ]; then
              echo "redis ready (attempt $i)"; break
            fi
            [ "$i" -eq 60 ] && { echo "::error::ephemeral redis did not become ready in 60s"; docker logs ciredis || true; exit 1; }
            sleep 1
          done

      - name: Assert single alembic head
        if: inputs.alembic
        run: |
          set -euo pipefail
          err="$(mktemp)"
          rc=0
          out="$(uv run alembic heads 2>"$err")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::'uv run alembic heads' FAILED (exit $rc) — the migration set could not be loaded. This is not a migration race: check for an import/syntax error in a revision file or a missing dependency."
            cat "$err" >&2
            exit 1
          fi
          n="$(printf '%s\n' "$out" | grep -c . || true)"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, got $n. A migration race created divergent heads; rebase and 'uv run alembic merge heads'."
            exit 1
          fi
          echo "alembic single-head check OK"

      - name: Run alembic migrations
        if: inputs.alembic
        run: uv run alembic upgrade head

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check --config "extend-exclude=['*.md']" .

      - name: Type check (ty)
        # PINNED deliberately: ty is a CI TOOL, not a library, so its version belongs to the
        # archetype rather than to each consumer's dependency graph. Unpinned (`uv run ty`) made
        # Dependabot raise the same bump in 8 repos at once, and ty 0.0.100 turned 14 PRs red on
        # diagnostics (`incompatible-mutable-override`, `missing-union-attribute`) that are real
        # but not worth chasing in Python we are exiting. Move this pin, never the consumers.
        env:
          SRC_DIR: ${{ inputs.src_dir }}
        run: uvx ty@0.0.39 check "$SRC_DIR"

      # Mirrors the archetype: use the project's own pytest-timeout when it has one, otherwise
      # inject one so a hung test cannot burn the whole job budget.
      - name: Resolve test flags
        id: flags
        env:
          UNIT_TIMEOUT: ${{ inputs.test_timeout_seconds }}
          INTEGRATION_TIMEOUT: ${{ inputs.integration_test_timeout_seconds }}
        run: |
          set -euo pipefail
          {
            if uv run python -c "import pytest_timeout" >/dev/null 2>&1; then
              echo "with="
              echo "unit_args="
              echo "integration_args="
            else
              echo "with=--with pytest-timeout"
              echo "unit_args=--timeout=$UNIT_TIMEOUT --timeout-method=thread"
              echo "integration_args=--timeout=$INTEGRATION_TIMEOUT --timeout-method=thread"
            fi
          } >> "$GITHUB_OUTPUT"
          {
            if uv run python -c "import pytest_cov" >/dev/null 2>&1; then
              echo "no_cov=--no-cov"
            else
              echo "no_cov="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          WITH_FLAGS: ${{ steps.flags.outputs.with }}
          TEST_DIR: ${{ inputs.test_dir }}
          UNIT_ARGS: ${{ steps.flags.outputs.unit_args }}
          NO_COV: ${{ steps.flags.outputs.no_cov }}
        run: |
          set -euo pipefail
          # Each var is a whitespace-separated flag list (or empty); read -a splits without
          # globbing, and an empty array expands to nothing.
          read -r -a with_flags <<< "$WITH_FLAGS"
          read -r -a test_dir <<< "$TEST_DIR"
          read -r -a unit_args <<< "$UNIT_ARGS"
          read -r -a no_cov <<< "$NO_COV"
          uv run "${with_flags[@]}" pytest "${test_dir[@]}" -v --tb=short "${unit_args[@]}" "${no_cov[@]}"

      # ⛔ The bootstrap runs HERE, in the same shell as the pytest it precedes — never in a
      # step of its own. A caller's bootstrap usually *exports* something the tests read
      # (`db_bootstrap_cmd: export TEST_DATABASE_URL=$DATABASE_URL`); an export in a previous
      # step dies with that step's shell, so the tests run without it. Measured on
      # coding-analysis, run 43414596003: the private archetype runs this prefix inline, the
      # public one had split it out, and the integration pass failed on the missing DSN.
      - name: DB integration tests
        if: inputs.has_postgres && inputs.integration_test_select != ''
        env:
          DB_BOOTSTRAP_CMD: ${{ inputs.db_bootstrap_cmd }}
          WITH_FLAGS: ${{ steps.flags.outputs.with }}
          INTEGRATION_SELECT: ${{ inputs.integration_test_select }}
          INTEGRATION_ARGS: ${{ steps.flags.outputs.integration_args }}
          NO_COV: ${{ steps.flags.outputs.no_cov }}
        # eval, not a sub-shell: a caller's bootstrap usually EXPORTS a variable the pytest
        # below must inherit (see the comment above this step).
        run: |
          set -euo pipefail
          if [ -n "$DB_BOOTSTRAP_CMD" ]; then
            echo "Bootstrapping CI DB: $DB_BOOTSTRAP_CMD"
            eval "$DB_BOOTSTRAP_CMD"
          fi
          read -r -a with_flags <<< "$WITH_FLAGS"
          read -r -a select <<< "$INTEGRATION_SELECT"
          read -r -a int_args <<< "$INTEGRATION_ARGS"
          read -r -a no_cov <<< "$NO_COV"
          uv run "${with_flags[@]}" pytest "${select[@]}" -v --tb=short "${int_args[@]}" "${no_cov[@]}"

      # The input is passed through env, never interpolated, and every name must be a dotted
      # Python identifier — a caller cannot smuggle shell through it.
      - name: Run oracle modules
        if: inputs.oracle_modules != ''
        env:
          ORACLE_MODULES: ${{ inputs.oracle_modules }}
        run: |
          set -uo pipefail
          ran=0; rc=0
          for mod in $ORACLE_MODULES; do
            if ! [[ "$mod" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$ ]]; then
              echo "::error::invalid module name '$mod'"; exit 1
            fi
            ran=$((ran+1))
            uv run --no-sync python -m "$mod" || rc=$?
          done
          if [ "$ran" -eq 0 ]; then echo "::error::oracle_modules set but no module names parsed"; exit 1; fi
          exit "$rc"

      - name: Install security tools
        if: (success() || failure()) && inputs.enable_security_scans && steps.install-deps.outcome == 'success'
        run: uv pip install "bandit[toml]" pip-audit

      - name: Security scan - bandit
        if: inputs.enable_security_scans
        env:
          SRC_DIR: ${{ inputs.src_dir }}
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -qE '^\[tool\.bandit(\]|\.)' pyproject.toml; then
            echo "::notice::[tool.bandit] present — honouring it via -c pyproject.toml"
            uv run bandit -c pyproject.toml -r "$SRC_DIR" -ll -ii -x ./.venv,./tests,./build,./dist,./.git,./node_modules
          else
            uv run bandit -r "$SRC_DIR" -ll -ii -x ./.venv,./tests,./build,./dist,./.git,./node_modules
          fi

      - name: Security scan - pip-audit
        if: (success() || failure()) && inputs.enable_security_scans && steps.install-deps.outcome == 'success'
        env:
          PIP_AUDIT_IGNORES: ${{ inputs.pip_audit_ignores }}
        run: |
          set -euo pipefail
          read -r -a ignores <<< "$PIP_AUDIT_IGNORES"
          rc=0
          for attempt in 1 2 3; do
            uv run pip-audit --skip-editable "${ignores[@]}" && exit 0
            rc=$?
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::pip-audit attempt $attempt failed (rc=$rc); retrying after backoff"
              sleep $((attempt * 15))
            fi
          done
          exit "$rc"

  # Build on every PR (proving the Dockerfile still builds); push only from main. There is no
  # deploy job: Flux watches the ghcr package through an ImagePolicy.
  image:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ inputs.registry_owner }}/${{ inputs.image_name }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Disk headroom
        working-directory: .
        run: df -h / /tmp | sed 's/^/  /'

      - name: Build image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build -t "$IMAGE:ci" -f "$DOCKERFILE" .

      - name: Smoke the built image
        if: inputs.build_smoke != ''
        env:
          IMAGE_REF: ${{ env.IMAGE }}:ci
          BUILD_SMOKE: ${{ inputs.build_smoke }}
        run: bash -c "$BUILD_SMOKE"

      - name: Log in to ghcr
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          # buildx --push, not `docker tag` + `docker push`: on the runner's Docker 29 containerd
          # image store the classic push path dies with "unknown blob" after the first layer
          # (measured 2026-11-13, run 43391868497). buildx re-uses the build cache, so this is a
          # cache-hit rebuild plus a correct registry upload.
          # --provenance=mode=max attaches a SLSA provenance attestation naming repo, commit and
          # workflow, so a puller can verify what produced the image.
          docker buildx build \
            --push \
            --provenance=mode=max \
            --tag "$IMAGE:sha-$short" \
            --tag "$IMAGE:latest" \
            --file "$DOCKERFILE" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          echo "published $IMAGE@$digest"
          {
            echo "### image published"
            echo "- \`$IMAGE@$digest\`"
            echo "- tags: \`sha-$short\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
