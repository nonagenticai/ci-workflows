name: go-service-public

# The Go twin of python-service.yml and node-service.yml: scan the tree, vet + test the module,
# then build the repo's own Dockerfile and publish it to ghcr.io/<registry_owner>/<image_name>
# from main. No repository secrets and no deploy job.
#
# `go vet` + `go test` are the gate, not golangci-lint: the standard toolchain is what a Go reader
# expects, and a repo that wants the extra linters keeps its config in-tree and adds a step of its
# own. `working_directory` defaults to `src` because a Go module in a service repo conventionally
# lives beside its Dockerfile rather than at the root.

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name under ghcr.io/<registry_owner>/."
        required: true
        type: string
      registry_owner:
        description: "ghcr namespace."
        type: string
        default: nonagenticai
      working_directory:
        description: "Directory containing go.mod AND the Dockerfile."
        type: string
        default: "src"
      go_version:
        description: "Go version to install (setup-go accepts `1.26`, `1.26.x`, or `stable`)."
        type: string
        default: "1.26"
      dockerfile:
        description: >
          Dockerfile path, relative to the REPOSITORY ROOT (a Go service keeps its Dockerfile at
          the root and its module in src/, so it cannot be working_directory-relative).
        type: string
        default: "Dockerfile"
      build_smoke:
        description: "Shell run against the built image with $IMAGE_REF set. Empty = skip."
        type: string
        default: ""
      build_timeout_minutes:
        description: "Job cap. A cancelled build reports as *pending*, not red — keep headroom."
        type: number
        default: 45
      ci_workflows_ref:
        description: >
          Ref of THIS repository used by the two scans (the selftest passes the PR head so the
          fixture always carries the code under test). Empty = main.
        type: string
        default: ""
    outputs:
      image_ref:
        description: >
          Ref a later job can pull: :sha-<7> on main, :pr-<7> for a same-repo PR. Empty on a fork
          PR — gate consumers off in that case.
        value: ${{ jobs.image.outputs.image_ref }}
      image_digest:
        description: "Published digest (sha256:...). Empty when nothing was pushed."
        value: ${{ jobs.image.outputs.image_digest }}

# Least privilege by default; only the `image` job widens to packages: write, and only for the push.
permissions:
  contents: read

jobs:
  secret-scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A commit SHA, or main. Never a branch, tag or refs/pull/* ref — see node-service.yml.
      - name: Resolve the ci-workflows ref (40-hex commit, else main)
        id: ci-ref
        env:
          REF_INPUT: ${{ inputs.ci_workflows_ref }}
        run: |
          set -euo pipefail
          ref="$REF_INPUT"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ steps.ci-ref.outputs.ref }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan the tree
        run: bash .ci-workflows/scripts/secret-scan.sh

  no-private-refs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve the ci-workflows ref (40-hex commit, else main)
        id: ci-ref
        env:
          REF_INPUT: ${{ inputs.ci_workflows_ref }}
        run: |
          set -euo pipefail
          ref="$REF_INPUT"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ steps.ci-ref.outputs.ref }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan tracked files
        run: bash .ci-workflows/scripts/no-private-refs.sh

  checks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No module cache: a cache a fork PR can write is a cache the next main build trusts, and
      # go.sum already pins every module.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Verify the module graph is consistent
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  image:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ inputs.registry_owner }}/${{ inputs.image_name }}
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref || steps.publish_pr.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      # The build context is the repository root: a Go service's Dockerfile compiles from `src/`
      # but may also copy config from the repository root.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ci_workflows_ref || '' }}
          persist-credentials: false

      - name: Disk headroom
        run: df -h / | sed 's/^/  /'

      - name: Log in to ghcr
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build -t "$IMAGE:ci" -f "$DOCKERFILE" .

      - name: Smoke the built image
        if: inputs.build_smoke != ''
        env:
          IMAGE_REF: ${{ env.IMAGE }}:ci
          BUILD_SMOKE: ${{ inputs.build_smoke }}
        run: bash -c "$BUILD_SMOKE"

      - name: Publish (main)
        id: publish
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          docker buildx build \
            --push \
            --provenance=mode=max \
            --tag "$IMAGE:sha-$short" \
            --tag "$IMAGE:latest" \
            --file "$DOCKERFILE" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          echo "published $IMAGE@$digest"
          echo "image_ref=$IMAGE:sha-$short" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish PR tag (same-repo PR)
        id: publish_pr
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          docker buildx build \
            --push \
            --provenance=mode=max \
            --tag "$IMAGE:pr-$short" \
            --file "$DOCKERFILE" \
            --metadata-file "$RUNNER_TEMP/meta-pr.json" \
            .
          echo "image_ref=$IMAGE:pr-$short" >> "$GITHUB_OUTPUT"
