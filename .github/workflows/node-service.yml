name: node-service-public

# The Node twin of python-service.yml: scan the tree, install, lint, test, then build the repo's
# own Dockerfile and publish it to ghcr.io/<registry_owner>/<image_name> from main. No repository
# secrets and no deploy job — a public repo's image exists for whoever pulls it, and its own CI is
# the acceptance gate.
#
# Deliberately NOT a general-purpose "run any shell" workflow: the three commands are inputs so a
# repo does not hand-roll a pipeline, but each defaults to the npm-script convention, and every
# value reaches the shell through `env:` so an input can never become script text (the same rule
# the python archetypes follow).

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name under ghcr.io/<registry_owner>/."
        required: true
        type: string
      registry_owner:
        description: "ghcr namespace."
        type: string
        default: nonagenticai
      working_directory:
        description: "Directory containing package.json (the CI manifest) and the Dockerfile."
        type: string
        default: "."
      node_version:
        description: "Node major/minor to install. The repo's engines.node must accept it."
        type: string
        default: "24"
      install_cmd:
        description: "Install command. Defaults to the lockfile-exact install."
        type: string
        default: "npm ci --no-audit --no-fund"
      lint_cmd:
        description: "Lint command; `--if-present` keeps a repo without the script green."
        type: string
        default: "npm run lint --if-present"
      test_cmd:
        description: "Test command; `--if-present` keeps a repo without the script honest but green."
        type: string
        default: "npm test --if-present"
      dockerfile:
        description: "Dockerfile path, relative to working_directory."
        type: string
        default: "Dockerfile"
      build_smoke:
        description: "Shell run against the built image with $IMAGE_REF set. Empty = skip."
        type: string
        default: ""
      build_timeout_minutes:
        description: "Job cap. A cancelled build reports as *pending*, not red — keep headroom."
        type: number
        default: 60
      ci_workflows_ref:
        description: >
          Ref of THIS repository used by the two scans (the selftest passes the PR head so the
          fixture always carries the code under test). Empty = main.
        type: string
        default: ""
    outputs:
      image_ref:
        description: >
          Ref a later job can pull: :sha-<7> on main, :pr-<7> for a same-repo PR. Empty on a fork
          PR — gate consumers off in that case.
        value: ${{ jobs.image.outputs.image_ref }}
      image_digest:
        description: "Published digest (sha256:...). Empty when nothing was pushed."
        value: ${{ jobs.image.outputs.image_digest }}

# Least privilege by default; only the `image` job widens to packages: write, and only for the push.
permissions:
  contents: read

jobs:
  secret-scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A commit SHA, or main. Never a branch, tag or refs/pull/* ref: the input exists so a
      # caller can run ITS OWN tree's scripts at a PR head, and a fork PR that could point this
      # at arbitrary unmerged code would be privilege-escalating into this repository's scripts.
      - name: Resolve the ci-workflows ref (40-hex commit, else main)
        id: ci-ref
        env:
          REF_INPUT: ${{ inputs.ci_workflows_ref }}
        run: |
          set -euo pipefail
          ref="$REF_INPUT"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ steps.ci-ref.outputs.ref }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan the tree
        run: bash .ci-workflows/scripts/secret-scan.sh

  no-private-refs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A commit SHA, or main. Never a branch, tag or refs/pull/* ref: the input exists so a
      # caller can run ITS OWN tree's scripts at a PR head, and a fork PR that could point this
      # at arbitrary unmerged code would be privilege-escalating into this repository's scripts.
      - name: Resolve the ci-workflows ref (40-hex commit, else main)
        id: ci-ref
        env:
          REF_INPUT: ${{ inputs.ci_workflows_ref }}
        run: |
          set -euo pipefail
          ref="$REF_INPUT"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ steps.ci-ref.outputs.ref }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan tracked files
        run: bash .ci-workflows/scripts/no-private-refs.sh

  checks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No action cache: a cache a fork PR can write is a cache the next main build trusts, and
      # `npm ci` against a committed lockfile is the deterministic path this archetype wants.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ""

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install_cmd }}
        run: bash -c "$INSTALL_CMD"

      - name: Lint
        env:
          LINT_CMD: ${{ inputs.lint_cmd }}
        run: bash -c "$LINT_CMD"

      - name: Test
        env:
          TEST_CMD: ${{ inputs.test_cmd }}
        run: bash -c "$TEST_CMD"

  image:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ inputs.registry_owner }}/${{ inputs.image_name }}
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref || steps.publish_pr.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ci_workflows_ref || '' }}
          persist-credentials: false

      - name: Disk headroom
        working-directory: .
        run: df -h / | sed 's/^/  /'

      # A private-at-first ghcr package is still readable by the token of the repo that published
      # it, so a chained job can pull this job's tag.
      - name: Log in to ghcr
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build -t "$IMAGE:ci" -f "$DOCKERFILE" .

      - name: Smoke the built image
        if: inputs.build_smoke != ''
        env:
          IMAGE_REF: ${{ env.IMAGE }}:ci
          BUILD_SMOKE: ${{ inputs.build_smoke }}
        run: bash -c "$BUILD_SMOKE"

      # buildx --push, not `docker tag` + `docker push`: on the runner's Docker 29 containerd
      # image store the classic path dies with "unknown blob" after the first layer
      # (measured 2026-11-13 on the python archetype).
      - name: Publish (main)
        id: publish
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          docker buildx build \
            --push \
            --provenance=mode=max \
            --tag "$IMAGE:sha-$short" \
            --tag "$IMAGE:latest" \
            --file "$DOCKERFILE" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          echo "published $IMAGE@$digest"
          echo "image_ref=$IMAGE:sha-$short" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### image published"
            echo "- \`$IMAGE@$digest\`"
            echo "- tags: \`sha-$short\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PR tag (same-repo PR)
        id: publish_pr
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          docker buildx build \
            --push \
            --provenance=mode=max \
            --tag "$IMAGE:pr-$short" \
            --file "$DOCKERFILE" \
            --metadata-file "$RUNNER_TEMP/meta-pr.json" \
            .
          echo "image_ref=$IMAGE:pr-$short" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE:pr-$short (PR tag, not latest)"
