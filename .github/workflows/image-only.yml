name: image-only-public

# Build ONE container image from a repo's own Dockerfile, and publish it to
# ghcr.io/<registry_owner>/<image_name> from main. No repository secrets, no deploy job: Flux
# watches the ghcr package through an ImagePolicy.
#
# This exists for images that are NOT the repo's Python service — a runtime image built from a
# bespoke Dockerfile (e.g. coding-containers' codegraph-runtime and codegraph-runtime-rust) — so
# such a repo does not carry its own hand-rolled workflow. It is deliberately single-image:
# a second image is a second caller job, not an input.
#
# Publish rules, all on GitHub-hosted runners:
#   * push to main        -> :sha-<7> + :latest, digest printed for the gitops pin
#   * workflow_dispatch / schedule on main -> the same (a caller's weekly re-bake must move the
#                            tag; a schedule only ever fires on the default branch)
#   * PR from this repo   -> :pr-<7> pushed after a smoke, so a LATER job can consume the image
#                            by digest-less tag (the runtime-rust image is FROM the runtime one)
#   * PR from a fork      -> build + smoke only, nothing pushed
on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name under ghcr.io/<registry_owner>/."
        required: true
        type: string
      registry_owner:
        description: "ghcr namespace."
        type: string
        default: nonagenticai
      working_directory:
        description: "Directory containing the project (build context and the Dockerfile's root)."
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to working_directory."
        type: string
        default: "Dockerfile"
      build_args:
        description: "Newline-separated KEY=VALUE build args."
        type: string
        default: ""
      build_smoke:
        description: "Shell run against the built image with $IMAGE_REF set. Empty = skip."
        type: string
        default: ""
      build_timeout_minutes:
        description: "Job cap. A cancelled build reports as *pending*, not red — keep headroom."
        type: number
        default: 60
      ci_workflows_ref:
        description: >
          Ref of THIS repository to check out in the caller's tree (the selftest passes the PR
          head so the fixture always carries the code under test). Empty = the caller's own ref.
        type: string
        default: ""
    outputs:
      image_ref:
        description: >
          Ref a LATER job can pull: :sha-<7> on main, :pr-<7> for a same-repo PR. Empty when
          nothing was pushed (fork PR) — gate consumers off in that case.
        value: ${{ jobs.image.outputs.image_ref }}
      image_digest:
        description: "Published digest (sha256:...). Empty when nothing was pushed."
        value: ${{ jobs.image.outputs.image_digest }}

# Least privilege by default; only the `image` job widens to packages: write, and only it
# needs it (the push). The two scan jobs read the tree and nothing else.
permissions:
  contents: read

jobs:
  # A public repo's own tree still has to be publishable: an image-only repo carries source,
  # fixtures and docs even when the build is a Dockerfile. Same two gates the python archetypes
  # ship, so no public repo is born without them.
  secret-scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ inputs.ci_workflows_ref || 'main' }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan the tree
        run: bash .ci-workflows/scripts/secret-scan.sh

  no-private-refs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nonagenticai/ci-workflows
          ref: ${{ inputs.ci_workflows_ref || 'main' }}
          path: .ci-workflows
          persist-credentials: false
      - name: Scan tracked files
        run: bash .ci-workflows/scripts/no-private-refs.sh

  image:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ inputs.registry_owner }}/${{ inputs.image_name }}
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref || steps.publish_pr.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ci_workflows_ref || '' }}
          persist-credentials: false

      - name: Disk headroom
        working-directory: .
        run: df -h / | sed 's/^/  /'

      # A private-at-first ghcr package is still readable by the token of the repo that
      # published it, so the second job of a two-image chain can pull the first one's tag.
      - name: Log in to ghcr
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Build args are materialised ONCE, as a file, and re-read by every build below.
      #
      # WHY A FILE: the publish steps are separate buildx invocations, and BuildKit folds every
      # ARG value an instruction references into its cache key. If the push did not re-pass the
      # same args it would MISS that cache and rebuild from the Dockerfile DEFAULT — pushing an
      # image nobody smoked (a caller chaining `BASE_IMAGE=${{ needs.x.outputs.image_ref }}`
      # would ship the wrong base). The value travels via env, never interpolated into the
      # script text, so a multi-line or quoted ARG cannot turn into shell.
      - name: Prepare build args
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          args_file="$RUNNER_TEMP/build-args.txt"
          : > "$args_file"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '%s\n' "$line" >> "$args_file"
          done <<< "$BUILD_ARGS"
          echo "build args: $(wc -l < "$args_file" | tr -d ' ')"

      - name: Build image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do
            args+=(--build-arg "$line")
          done < "$RUNNER_TEMP/build-args.txt"
          docker build -t "$IMAGE:ci" -f "$DOCKERFILE" "${args[@]}" .

      - name: Smoke the built image
        if: inputs.build_smoke != ''
        env:
          IMAGE_REF: ${{ env.IMAGE }}:ci
          BUILD_SMOKE: ${{ inputs.build_smoke }}
        run: bash -c "$BUILD_SMOKE"

      # buildx --push, not `docker tag` + `docker push`: on the runner's Docker 29 containerd
      # image store the classic push path dies with "unknown blob" after the first layer
      # (measured 2026-11-13). This is a cache-hit rebuild ONLY because it re-passes the same
      # build args from Prepare build args — drop them and the cache key changes, so the pushed
      # image is rebuilt from the Dockerfile default instead of the layer that was smoked.
      # `schedule` publishes too: a weekly re-bake exists to move the tag, and a scheduled run
      # is always on the default branch, so the ref guard still holds.
      - name: Publish (main)
        id: publish
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          args=()
          while IFS= read -r line; do
            args+=(--build-arg "$line")
          done < "$RUNNER_TEMP/build-args.txt"
          # --provenance=mode=max: the pushed manifest carries a SLSA build provenance
          # attestation naming this repo, this commit and this workflow. It costs one flag and
          # is the only thing that lets a puller verify what produced the image.
          docker buildx build \
            --push \
            --provenance=mode=max \
            --tag "$IMAGE:sha-$short" \
            --tag "$IMAGE:latest" \
            --file "$DOCKERFILE" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            "${args[@]}" \
            .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          echo "published $IMAGE@$digest"
          echo "image_ref=$IMAGE:sha-$short" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### image published"
            echo "- \`$IMAGE@$digest\`"
            echo "- tags: \`sha-$short\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PR tag (same-repo PR)
        id: publish_pr
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          args=()
          while IFS= read -r line; do
            args+=(--build-arg "$line")
          done < "$RUNNER_TEMP/build-args.txt"
          # Same provenance flag as the main publish: this is the PR path, so the selftest
          # proves the flag works on a hosted runner BEFORE it reaches main.
          docker buildx build \
            --push \
            --provenance=mode=max \
            --tag "$IMAGE:pr-$short" \
            --file "$DOCKERFILE" \
            --metadata-file "$RUNNER_TEMP/meta-pr.json" \
            "${args[@]}" \
            .
          echo "image_ref=$IMAGE:pr-$short" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE:pr-$short (PR tag, not latest)"
